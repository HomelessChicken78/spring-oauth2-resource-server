spring:
  application:
    name: spring-oauth2-resource-server

  jpa:
    hibernate:
      ddl-auto: ${HIBERNATE_DDL_AUTO}

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

server:
  servlet:
    context-path: /${CONTEXT_PATH:api}
  port: ${SERVER_PORT:8080}